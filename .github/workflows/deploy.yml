name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never cancels a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # `_next` starts with an underscore, which the legacy Jekyll pipeline drops. Actions-based
      # Pages deploys do not run Jekyll, but the marker costs nothing and removes the question.
      - run: touch out/.nojekyll

      - name: Fail if the library asset did not export
        run: test -s out/library.json && node -e "const l=require('./out/library.json');if(!l.topics?.length)process.exit(1)"

      - name: Fail if the playbooks asset did not export
        run: test -s out/playbooks.json && node -e "const p=require('./out/playbooks.json');if(!p.playbooks?.length)process.exit(1)"

      # Every playbook is a prerendered directory. Pages has no server to resolve a slug, so a
      # missing one is a 404 the dev server would have happily served.
      - name: Fail if a playbook page did not prerender
        run: node -e "const {existsSync}=require('fs');const p=require('./out/playbooks.json');const missing=p.playbooks.filter(b=>!existsSync('out/playbooks/'+b.slug+'/index.html'));if(missing.length){console.error('not prerendered:',missing.map(b=>b.slug).join(', '));process.exit(1)}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
